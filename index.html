
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BELLWOOD | Open World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111820;color:white;font-family:Arial}
canvas{display:block}
#brand{position:fixed;top:16px;left:18px;pointer-events:none}
#brand b{font-size:23px;letter-spacing:5px}
#brand small{display:block;letter-spacing:3px;color:#c5b38e;margin-top:4px}
#mission{position:fixed;top:15px;right:15px;width:230px;
background:#101820d9;border:1px solid #ffffff30;padding:13px;
font-size:12px;line-height:1.6;border-radius:5px;pointer-events:none}
#mission strong{color:#e4c38b;letter-spacing:1px}
#location{position:fixed;bottom:17px;left:18px;font-size:12px;
letter-spacing:2px;color:#e4d7bd;text-shadow:0 2px 5px black}
#dialog{display:none;position:fixed;bottom:25px;left:50%;
transform:translateX(-50%);width:min(520px,90vw);
background:#111c27f5;border:1px solid #ffffff40;padding:18px;border-radius:8px}
#speaker{font-size:12px;color:#e4c38b;letter-spacing:2px}
#words{line-height:1.6;font-size:15px;margin:12px 0}
button{border:0;border-radius:5px;padding:11px 17px;
background:#d8b77b;color:#171717;font-weight:bold}
#controls{display:none;position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:22px;bottom:28px;width:125px;height:125px;
border-radius:50%;border:2px solid #ffffff55;background:#ffffff19;
pointer-events:auto;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:49px;height:49px;
border-radius:50%;background:#ffffffa8}
#cameraArea{position:absolute;right:0;top:20%;width:55%;height:55%;
pointer-events:auto;touch-action:none}
#buttons{position:absolute;right:20px;bottom:25px;display:grid;
grid-template-columns:65px 65px;gap:10px;pointer-events:auto}
#buttons button{width:65px;height:65px;border-radius:50%;
background:#17212bdc;color:white;border:1px solid #ffffff60;
font-size:11px;padding:4px}
#buttons button.main{background:#d4b579;color:#171717}
@media(pointer:coarse){#controls{display:block}}
#desktopHelp{position:fixed;bottom:16px;right:18px;font-size:11px;
color:#ffffffa0;pointer-events:none}
@media(pointer:coarse){#desktopHelp{display:none}}
</style>
</head>
<body>
<div id="brand"><b>BELLWOOD</b><small>AFTER HOURS</small></div>
<div id="mission"><strong>GÖREV: KAYIP PAKET</strong><br>
Birisi gece yarısı sana bir konum gönderdi.<br>
<span id="task">Sokağın sonundaki kişiyi bul.</span></div>
<div id="location">DOWNTOWN · 23:41</div>
<div id="desktopHelp">WASD: Hareket · Mouse: Kamera · Shift: Koş · Space: Zıpla · E: Etkileşim</div>
<div id="dialog"><div id="speaker"></div><div id="words"></div><button id="close">DEVAM</button></div>
<div id="controls">
 <div id="joy"><div id="knob"></div></div>
 <div id="cameraArea"></div>
 <div id="buttons">
  <button id="jump">ZIPLA</button>
  <button id="run">KOŞ</button>
  <button id="interact" class="main">ETKİLEŞ</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
if(!window.THREE){
 document.body.innerHTML="<h2 style='padding:25px'>3D motor yüklenemedi. İnternet bağlantısını kontrol et.</h2>";
 throw new Error("Three.js unavailable");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ba9ad);
scene.fog=new THREE.Fog(0x9ba9ad,45,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe7f0ff,0x42403b,1.8));
const sun=new THREE.DirectionalLight(0xffdfb0,2.1);
sun.position.set(-40,70,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),mat(0x646960));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function cube(parent,x,y,z,w,h,d,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y+h/2,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function makeRoad(x,z,w,d){
 cube(scene,x,-.03,z,w,.06,d,0x303538);
 if(w>d){
  for(let a=x-w/2+5;a<x+w/2-5;a+=13)
   cube(scene,a,.01,z,.6,.015,.13,0xb4a986);
 }else{
  for(let a=z-d/2+5;a<z+d/2-5;a+=13)
   cube(scene,x,.01,a,.13,.015,.6,0xb4a986);
 }
}
for(let z=-120;z<=120;z+=45)makeRoad(0,z,260,15);
for(let x=-120;x<=120;x+=50)makeRoad(x,0,15,260);

const sidewalkMat=0x92918a;
for(let z=-120;z<=120;z+=45){
 cube(scene,0,.02,z-10,260,.08,4,sidewalkMat);
 cube(scene,0,.02,z+10,260,.08,4,sidewalkMat);
}
for(let x=-120;x<=120;x+=50){
 cube(scene,x-10,.02,0,4,.08,260,sidewalkMat);
 cube(scene,x+10,.02,0,4,.08,260,sidewalkMat);
}

// Buildings with windows, doors and enterable interiors
const buildings=[];
function createBuilding(x,z,w,d,h,color,insideName){
 const group=new THREE.Group();
 scene.add(group);
 cube(group,0,h/2,0,w,h,d,color);
 // Front facade and windows
 const front=z+d/2+.055;
 const rows=Math.max(1,Math.floor(h/3));
 for(let y=2.2;y<h-1;y+=3){
  for(let xx=-w/2+2;xx<w/2-1.5;xx+=3.2){
   cube(group,xx,y,front,.95,1.25,.1,0x263c48);
   cube(group,xx,y,front+.07,.75,.08,.025,0x8b9b9b);
  }
 }
 // Doorway
 cube(group,0,1.25,front+.03,1.45,2.5,.14,0x3b2d26);
 cube(group,0,1.25,front+.13,1.15,2.25,.1,0x79624a);
 cube(group,.43,1.2,front+.2,.07,.07,.07,0xe2c17c);
 const sign=cube(group,0,h-.7,front+.1,Math.min(w-2,8),.55,.15,0xc4a16c);
 sign.material=mat(0xc4a16c);
 const entry={x,z:z+d/2+3,group,name:insideName,interior:null};
 buildings.push(entry);
 return entry;
}
const buildingColors=[0x77736a,0x8b786b,0x5e6a6c,0x737a79,0x675b55,0x8b806e];
const places=[
 [-35,-35,19,19,15,"MARKET"],
 [35,-35,20,19,19,"APARTMENT"],
 [-35,35,20,19,16,"GARAGE"],
 [35,35,20,19,17,"LOUNGE"],
 [-85,-35,18,20,22,"OFFICE"],
 [85,-35,20,19,14,"STORE"],
 [-85,35,20,20,17,"DINER"],
 [85,35,20,20,20,"HOTEL"],
 [-35,-85,20,20,15,"SHOP"],
 [35,-85,20,20,19,"STUDIO"],
 [-35,85,20,20,16,"CAFE"],
 [35,85,20,20,17,"CLUB"]
];
places.forEach((p,i)=>createBuilding(...p.slice(0,5),buildingColors[i%buildingColors.length],p[5]));

// Interiors are separate rooms shown when entering a doorway
function makeInterior(name){
 const g=new THREE.Group();
 cube(g,0,-.15,0,24,.3,22,0x55504a);
 cube(g,0,3,-11,24,6,.3,0x77716a);
 cube(g,-12,3,0,.3,6,22,0x77716a);
 cube(g,12,3,0,.3,6,22,0x77716a);
 cube(g,0,3,11,24,6,.3,0x77716a);
 // ceiling lights
 for(let x of [-6,0,6]){
  cube(g,x,5.8,0,2,.12,1,0xe1c99c);
 }
 if(name==="MARKET"||name==="STORE"){
  for(let x of [-7,-3,1,5]){
   cube(g,x,1.1,-5,1.2,2,8,0x80694e);
   for(let y of [.7,1.2,1.7]){
    cube(g,x,y,-5,1.4,.08,7.8,0xb19b78);
   }
  }
  cube(g,0,.6,7,8,1.2,1.2,0x6a4d3a);
 }else{
  cube(g,0,.5,0,6,1,3,0x665047);
  cube(g,-6,.6,-5,3,1.2,2,0x7a604d);
  cube(g,6,.6,-5,3,1.2,2,0x7a604d);
  cube(g,0,1.4,-9,7,2.8,.4,0x373b3d);
 }
 return g;
}
buildings.forEach(b=>b.interior=makeInterior(b.name));

// Street lights
for(let x=-110;x<=110;x+=30){
 for(let z=-110;z<=110;z+=45){
  cube(scene,x,1.7,z,.14,3.4,.14,0x292c2d);
  cube(scene,x,3.45,z,.9,.15,.45,0xd7c29a);
 }
}

// Cars
const cars=[];
for(let i=0;i<12;i++){
 const g=new THREE.Group();
 cube(g,0,.7,0,2.2,.8,4.3,[0x333e48,0x74716a,0x654a46,0x9c9b91][i%4]);
 cube(g,0,1.35,-.25,1.7,.65,2,0x87999c);
 for(let side of [-1,1]){
  for(let z of [-1.3,1.3]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.2,12),mat(0x17191b));
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(side*1.1,.4,z);
   g.add(wheel);
  }
 }
 g.position.set(-90+(i%6)*32,0,(i<6?-17:28));
 scene.add(g);
 cars.push(g);
}

// Character
const player=new THREE.Group();
scene.add(player);
const shirt=mat(0x344758),skin=mat(0xc18f72),pants=mat(0x252a30),hair=mat(0x201c1a);
const torso=cube(player,0,1.25,0,.72,1,.4,0x344758);
const head=cube(player,0,2,0,.42,.43,.42,0xc18f72);
cube(player,0,2.23,0,.44,.17,.44,0x201c1a);
const legL=cube(player,-.19,.4,0,.24,.8,.27,0x252a30);
const legR=cube(player,.19,.4,0,.24,.8,.27,0x252a30);
const armL=cube(player,-.48,1.25,0,.22,.72,.22,0x344758);
const armR=cube(player,.48,1.25,0,.22,.72,.22,0x344758);
player.position.set(0,0,12);

// NPCs
const names=["Mara","Elliot","Deniz","Jade","Noah","Riley","Alex","Mika","Theo","Iris"];
const dialogues=[
 ["You new around here?","This city has a way of keeping people."],
 ["I swear that car has been parked there for three days.","Nobody knows who owns it."],
 ["The old station? Don't go there after midnight.","Actually, do whatever you want."],
 ["I'm waiting for someone. Or maybe I'm not.","Long story."],
 ["You didn't hear this from me, alright?","Something happened downtown last night."]
];
const npcs=[];
for(let i=0;i<15;i++){
 const g=new THREE.Group();
 cube(g,0,1.15,0,.68,1,.38,[0x65727b,0x775d53,0x5d657d,0x9a8060][i%4]);
 cube(g,0,1.9,0,.4,.4,.4,0xc18f72);
 cube(g,0,2.12,0,.42,.16,.42,0x282321);
 cube(g,-.17,.35,0,.22,.7,.24,0x262b30);
 cube(g,.17,.35,0,.22,.7,.24,0x262b30);
 g.position.set(-95+Math.random()*190,0,-95+Math.random()*190);
 scene.add(g);
 npcs.push({mesh:g,name:names[i%names.length],lines:dialogues[i%dialogues.length],
 vx:0,vz:0,timer:Math.random()*4});
}

// Mission collectibles
const collectibles=[];
for(let i=0;i<3;i++){
 const g=new THREE.Group();
 const orb=new THREE.Mesh(new THREE.OctahedronGeometry(.45),mat(0xe5bd70));
 orb.position.y=.7;g.add(orb);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.7,.045,6,20),mat(0xf3dfb1));
 ring.rotation.x=Math.PI/2;ring.position.y=.1;g.add(ring);
 g.position.set([-70,70,70][i],0,[-75,-75,75][i]);
 scene.add(g);
 collectibles.push({mesh:g,found:false});
}

// Input and controls
const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e")interact();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let yaw=0,pitch=.13,drag=false,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse"){drag=true;lastX=e.clientX;lastY=e.clientY;}
});
addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{
 if(drag){
  yaw-=(e.clientX-lastX)*.006;
  pitch=THREE.MathUtils.clamp(pitch-(e.clientY-lastY)*.003,-.15,.65);
  lastX=e.clientX;lastY=e.clientY;
 }
});

const cameraArea=document.getElementById("cameraArea");
let camPointer=null,camX=0,camY=0;
cameraArea.addEventListener("pointerdown",e=>{
 camPointer=e.pointerId;cameraArea.setPointerCapture(camPointer);
 camX=e.clientX;camY=e.clientY;
});
cameraArea.addEventListener("pointermove",e=>{
 if(e.pointerId===camPointer){
  yaw-=(e.clientX-camX)*.008;
  pitch=THREE.MathUtils.clamp(pitch-(e.clientY-camY)*.004,-.15,.65);
  camX=e.clientX;camY=e.clientY;
 }
});
cameraArea.addEventListener("pointerup",()=>camPointer=null);
cameraArea.addEventListener("pointercancel",()=>camPointer=null);

// Virtual joystick
let jx=0,jy=0,jpid=null;
const joy=document.getElementById("joy"),knob=document.getElementById("knob");
joy.addEventListener("pointerdown",e=>{
 jpid=e.pointerId;joy.setPointerCapture(jpid);moveJoy(e);
});
joy.addEventListener("pointermove",e=>{if(e.pointerId===jpid)moveJoy(e)});
function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
 const len=Math.hypot(x,y),s=Math.min(1,44/(len||1));
 jx=x*s/44;jy=y*s/44;
 knob.style.transform=`translate(${jx*31}px,${jy*31}px)`;
}
function stopJoy(){jpid=null;jx=jy=0;knob.style.transform="translate(0,0)"}
joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);

let running=false,jumpRequested=false;
document.getElementById("run").addEventListener("pointerdown",()=>running=true);
document.getElementById("run").addEventListener("pointerup",()=>running=false);
document.getElementById("run").addEventListener("pointercancel",()=>running=false);
document.getElementById("jump").onclick=()=>jumpRequested=true;
document.getElementById("interact").onclick=interact;

// Interior switching
let inside=null;
function enterBuilding(b){
 if(inside){
  inside.group.visible=true;
  inside.interior.visible=false;
  player.position.set(inside.x,0,inside.z-4);
  inside=null;
  document.getElementById("location").textContent="DOWNTOWN · 23:41";
 }else{
  inside=b;
  b.group.visible=false;
  b.interior.visible=true;
  player.position.set(0,0,6);
  document.getElementById("location").textContent=b.name+" · INTERIOR";
 }
}
buildings.forEach(b=>{b.interior.visible=false;});

// Dialogues
let talking=false;
function say(name,text){
 document.getElementById("speaker").textContent=name.toUpperCase();
 document.getElementById("words").textContent=text;
 document.getElementById("dialog").style.display="block";
 talking=true;
}
function closeDialog(){
 document.getElementById("dialog").style.display="none";
 talking=false;
}
document.getElementById("close").onclick=closeDialog;

let collected=0;
function interact(){
 if(talking){closeDialog();return}
 let closest=null,best=4;
 npcs.forEach(n=>{
  const d=player.position.distanceTo(n.mesh.position);
  if(d<best){best=d;closest=n;}
 });
 if(inside){
  if(player.position.length()<2.8){
   enterBuilding(inside);
   return;
  }
  say(inside.name,"There's not much to see here yet. The city is still being built.");
  return;
 }
 let door=null;
 buildings.forEach(b=>{
  const d=Math.hypot(player.position.x-b.x,player.position.z-b.z);
  if(d<5&&d<best){best=d;door=b;closest=null;}
 });
 let item=null;
 collectibles.forEach(c=>{
  if(!c.found){
   const d=player.position.distanceTo(c.mesh.position);
   if(d<best){best=d;item=c;door=null;closest=null;}
  }
 });
 if(item){
  item.found=true;item.mesh.visible=false;collected++;
  document.getElementById("task").textContent="Bulunan ipuçları: "+collected+"/3";
  say("EVIDENCE","You found something someone clearly didn't want you to see.");
  if(collected===3){
   document.getElementById("mission").querySelector("strong").textContent="GÖREV TAMAMLANDI";
   document.getElementById("task").textContent="Yeni bir mesaj bekleniyor...";
  }
 }else if(door){
  enterBuilding(door);
 }else if(closest){
  say(closest.name,closest.lines[Math.floor(Math.random()*closest.lines.length)]);
 }else{
  say("BELLWOOD","Nothing interesting nearby.");
 }
}

// Movement
const clock=new THREE.Clock();
const move=new THREE.Vector3(),forward=new THREE.Vector3(),right=new THREE.Vector3();
let vertical=0,onGround=true;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(!talking){
  let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-jy;
  let r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jx;
  forward.set(Math.sin(yaw),0,-Math.cos(yaw));
  right.set(Math.cos(yaw),0,Math.sin(yaw));
  move.copy(forward).multiplyScalar(f).addScaledVector(right,r);
  const moving=move.lengthSq()>0;
  if(moving){
   move.normalize();
   const speed=(running||keys.shift?11:6)*dt;
   player.position.addScaledVector(move,speed);
   player.rotation.y=Math.atan2(move.x,move.z);
   const swing=Math.sin(performance.now()*.012)*(running?0.65:0.35);
   legL.rotation.x=swing;legR.rotation.x=-swing;
   armL.rotation.x=-swing;armR.rotation.x=swing;
  }else{
   legL.rotation.x=0;legR.rotation.x=0;armL.rotation.x=0;armR.rotation.x=0;
  }
  if(jumpRequested&&onGround){vertical=7;onGround=false;}
  jumpRequested=false;
  vertical-=20*dt;
  player.position.y+=vertical*dt;
  if(player.position.y<0){player.position.y=0;vertical=0;onGround=true;}
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-125,125);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-125,125);

 for(const n of npcs){
  n.timer-=dt;
  if(n.timer<=0){
   n.vx=(Math.random()-.5)*.7;n.vz=(Math.random()-.5)*.7;
   n.timer=2+Math.random()*4;
  }
  n.mesh.position.x+=n.vx*dt;
  n.mesh.position.z+=n.vz*dt;
  n.mesh.position.x=THREE.MathUtils.clamp(n.mesh.position.x,-120,120);
  n.mesh.position.z=THREE.MathUtils.clamp(n.mesh.position.z,-120,120);
 }

 collectibles.forEach(c=>{
  if(!c.found){c.mesh.rotation.y+=dt*.9;c.mesh.position.y=.1+Math.sin(performance.now()*.002)*.12;}
 });

 const distance=7;
 const desired=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*distance,
  player.position.y+3.2+pitch*4,
  player.position.z+Math.cos(yaw)*distance
 );
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,player.position.y+1.45,player.position.z);

 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
